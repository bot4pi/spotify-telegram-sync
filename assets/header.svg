<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" role="img" aria-label="Spotify и Telegram">
  <title>Spotify → Telegram</title>

  <!-- Spotify: зелёный круг с тремя дугами -->
  <g transform="translate(80 30)">
    <circle cx="70" cy="70" r="70" fill="#1DB954"/>
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M32 56c26-8 54-6 78 6" stroke-width="15"/>
      <path d="M38 82c21-6 44-4 63 5" stroke-width="12"/>
      <path d="M44 105c17-5 35-3 50 4" stroke-width="10"/>
    </g>
  </g>

  <!-- Telegram: бумажный самолётик -->
  <g transform="translate(300 30)">
    <path d="M8 74 L152 14 L120 132 L74 96 Z" fill="#2AABEE"/>
    <path d="M74 96 L152 14 L70 122 Z" fill="#229ED9"/>
    <path d="M74 96 L110 84 L74 122 Z" fill="#fff" opacity=".92"/>
  </g>
</svg>
